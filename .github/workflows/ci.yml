name: 지속적 검증

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - name: 전체 빌드와 검증
        run: ./build.sh
      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v7
        with:
          name: Meslotendard-${{ github.sha }}
          path: |
            dist/Meslotendard.zip
            dist/SHA256SUMS.txt
            assets/meslotendard-preview.png
          retention-days: 14
          if-no-files-found: error

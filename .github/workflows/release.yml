name: 릴리스

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 수동 전체 빌드와 검증
        if: github.event_name == 'workflow_dispatch'
        run: ./build.sh
      - name: 태그 버전 전체 빌드와 검증
        if: github.event_name == 'push'
        run: ./build.sh "${GITHUB_REF_NAME#v}"
      - name: 수동 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: Meslotendard-${{ github.ref_name }}
          path: |
            dist/Meslotendard.zip
            dist/SHA256SUMS.txt
            assets/meslotendard-preview.png
          retention-days: 14
          if-no-files-found: error
      - name: GitHub Release 게시
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/Meslotendard.zip
            dist/SHA256SUMS.txt

name: 릴리스

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - name: 수동 전체 빌드와 검증
        if: github.event_name == 'workflow_dispatch'
        run: ./build.sh
      - name: 태그 버전 전체 빌드와 검증
        if: github.event_name == 'push'
        run: ./build.sh "${GITHUB_REF_NAME#v}"
      - name: 수동 빌드 결과 보관
        uses: actions/upload-artifact@v7
        with:
          name: Meslotendard-${{ github.ref_name }}
          path: |
            dist/Meslotendard.zip
            dist/SHA256SUMS.txt
            assets/meslotendard-preview.png
          retention-days: 14
          if-no-files-found: error
      - name: GitHub Release 게시
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'push'
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Meslotendard `${{ github.ref_name }}` 릴리스입니다.

            - Nerd Font 아이콘을 포함한 단일 고정폭 글꼴
            - Regular, Italic, Bold, BoldItalic 제공
            - 영문 1칸과 한글 2칸 비율 적용
            - 리게이처 비활성화

            `Meslotendard.zip`과 `SHA256SUMS.txt`를 함께 제공합니다.
          files: |
            dist/Meslotendard.zip
            dist/SHA256SUMS.txt
